<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stranded in Space</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <canvas id="screen" aria-label="Stranded in Space game area"></canvas>

    <div class="top-buttons">
      <button id="btn-pause" class="round-btn" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="btn-mute" class="round-btn" type="button" aria-label="Mute">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="stick" class="touch-control" aria-hidden="true"><div id="stick-knob"></div></div>
    <div class="touch-buttons touch-control">
      <button id="btn-jump" type="button" aria-label="Hyperspace jump">JUMP</button>
      <button id="btn-weapon" type="button" aria-label="Switch weapon">GUN</button>
    </div>

    <div id="pause-overlay" class="overlay" hidden>
      <div class="panel">
        <h1>Paused</h1>
        <button id="btn-resume" type="button">Resume</button>
        <button id="btn-restart" type="button" class="secondary">Restart</button>
      </div>
    </div>
  </main>

  <script src="js/jsfxr.js"></script>
  <script src="js/font.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
